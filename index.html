<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Stack Game - Rainbow Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #dbeafe; /* Fallback color */
            font-family: 'Poppins', sans-serif;
            touch-action: none; /* Prevent zoom/scroll on mobile */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to game */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .score-container {
            text-align: center;
            color: #334155;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        #score {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            margin: 0;
            line-height: 1;
        }

        #high-score {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.7;
        }

        /* Screens (Start / Game Over) */
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            pointer-events: auto; /* Re-enable clicks for buttons */
            transition: opacity 0.3s;
            display: none;
        }

        .screen.active {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #475569;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(99, 102, 241, 0.4);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* Petunjuk Awal */
        #instruction {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: #64748b;
            font-weight: 600;
            animation: pulse 2s infinite;
            pointer-events: none;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="score-container">
            <div id="score">0</div>
            <div id="high-score">High Score: 0</div>
        </div>
    </div>

    <div id="start-screen" class="screen active">
        <h1>3D STACK</h1>
        <p>Tumpuk setinggi mungkin!</p>
        <button id="start-btn">MAIN</button>
    </div>

    <div id="game-over-screen" class="screen">
        <h1>GAME OVER</h1>
        <p>Skor Akhir: <span id="final-score">0</span></p>
        <button id="restart-btn">MAIN LAGI</button>
    </div>

    <div id="instruction">Tap / Klik untuk meletakkan blok</div>

    <script>
        /**
         * 3D STACK GAME - LOGIC CORE
         */

        // --- KONFIGURASI GAME ---
        const CONFIG = {
            boxHeight: 1,
            originalBoxSize: 3,
            moveSpeed: 0.15,
            bgColor: 0xdbeafe, // Soft Blue Pastel
            cameraOffset: 10,
            cameraZoom: 2.5
        };

        // --- VARIABEL GLOBAL ---
        let scene, camera, renderer;
        let stack = []; 
        let overhangs = []; // Puing-puing yang jatuh
        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('stackHighScore') || 0;
        
        // Logika Gerakan
        let axis = 'x'; // 'x' atau 'z'
        let direction = 1; // 1 atau -1
        let currentBlock = null;

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const instructionEl = document.getElementById('instruction');

        // Update UI Awal
        highScoreEl.innerText = `High Score: ${highScore}`;

        // --- INIT THREE.JS ---
        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.bgColor);
            
            // Tambahkan kabut untuk kedalaman (Fog)
            scene.fog = new THREE.Fog(CONFIG.bgColor, 10, 25);

            // 2. Camera (Orthographic untuk tampilan isometrik yang bersih)
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            
            // Posisi Isometric
            camera.position.set(CONFIG.cameraOffset, CONFIG.cameraOffset, CONFIG.cameraOffset);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Aktifkan bayangan
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 4. Pencahayaan (Lighting)
            setupLighting();

            // 5. Setup Awal Blok Basis
            resetGameBase();

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // Input (Mouse & Touch)
            document.addEventListener('click', handleInput);
            document.addEventListener('touchstart', (e) => {
                // Prevent ghost clicks on buttons
                if(e.target.tagName !== 'BUTTON') {
                    handleInput(e);
                }
            }, {passive: false});

            // Tombol UI
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);

            // Mulai Render Loop
            animate();
        }

        function setupLighting() {
            // Cahaya Ambient (Umum)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Cahaya Matahari (Directional) untuk bayangan
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            
            // Optimasi area bayangan
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            const d = 10;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;

            scene.add(dirLight);
        }

        // --- GENERATOR WARNA DINAMIS ---
        function getRainbowColor(index) {
            // Menggunakan HSL. Hue berubah 5 derajat setiap blok.
            // Saturation 70%, Lightness 60% (Pastel Vibrant)
            const hue = (index * 10) % 360; 
            return new THREE.Color(`hsl(${hue}, 75%, 60%)`);
        }

        // --- SISTEM BLOK ---
        
        /**
         * FUNGSI UNTUK MENGGANTI MODEL 3D (GLTFLoader)
         * ----------------------------------------------------
         * Jika Anda ingin menggunakan model 3D kustom (misalnya dari Blender):
         * 1. Hapus/Komentari bagian `new THREE.BoxGeometry`.
         * 2. Gunakan GLTFLoader untuk memuat model.
         * 3. Masalah: Karena game ini memotong geometri (slicing),
         * menggunakan model statis (GLTF) sulit karena meshnya harus dipotong secara dinamis.
         * * SOLUSI TERBAIK UNTUK PEMULA:
         * Tetap gunakan BoxGeometry untuk logika fisikanya, tapi letakkan 
         * model GLTF "kecil" di dalam atau di atas blok sebagai hiasan.
         */

        function createBlock(x, y, z, width, depth, index) {
            // Geometri
            const geometry = new THREE.BoxGeometry(width, CONFIG.boxHeight, depth);
            
            // Material dengan warna dinamis
            const material = new THREE.MeshLambertMaterial({ 
                color: getRainbowColor(index)
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);
            return mesh;
        }

        function createOverhang(x, y, z, width, depth, color) {
            const geometry = new THREE.BoxGeometry(width, CONFIG.boxHeight, depth);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            scene.add(mesh);
            return mesh;
        }

        // --- LOGIKA GAMEPLAY ---

        function startGame() {
            // Reset Variable
            gameActive = true;
            score = 0;
            scoreEl.innerText = score;
            
            // UI Update
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            instructionEl.style.display = 'block';

            // Bersihkan Scene
            resetGameBase();

            // Tambah blok pertama yang bergerak
            spawnNextBlock();
        }

        function resetGameBase() {
            // Hapus semua blok lama dari scene
            stack.forEach(mesh => scene.remove(mesh));
            overhangs.forEach(obj => scene.remove(obj.mesh));
            
            stack = [];
            overhangs = [];

            // Blok Dasar (Fondasi)
            const baseBlock = createBlock(0, 0, 0, CONFIG.originalBoxSize, CONFIG.originalBoxSize, 0);
            stack.push(baseBlock);
        }

        function spawnNextBlock() {
            const prevBlock = stack[stack.length - 1];
            
            // Ganti sumbu setiap kali spawn
            axis = (axis === 'x') ? 'z' : 'x';
            
            // Tentukan posisi awal (jauh di kiri/kanan atau depan/belakang)
            const limit = 6;
            const pos = prevBlock.position.clone();
            pos.y += CONFIG.boxHeight;
            pos[axis] = -limit; // Mulai dari sisi negatif
            direction = 1;      // Bergerak ke positif

            // Dapatkan dimensi blok sebelumnya
            const width = prevBlock.geometry.parameters.width;
            const depth = prevBlock.geometry.parameters.depth;

            // Buat blok baru
            currentBlock = createBlock(pos.x, pos.y, pos.z, width, depth, stack.length);
            // Simpan ukuran asli untuk referensi saat bergerak
            currentBlock.userData = { 
                width: width, 
                depth: depth,
                startSpeed: CONFIG.moveSpeed + (score * 0.005) // Sedikit lebih cepat setiap level
            };
        }

        function handleInput(e) {
            // Abaikan input jika game tidak aktif atau klik pada tombol UI
            if (!gameActive) return;
            if (e.target.tagName === 'BUTTON') return;

            instructionEl.style.display = 'none';

            // Logika Pemotongan (Slicing Logic)
            const prevBlock = stack[stack.length - 1];
            const currBlock = currentBlock;

            const prevPos = prevBlock.position[axis];
            const currPos = currBlock.position[axis];

            const delta = currPos - prevPos;
            const absDelta = Math.abs(delta);

            // Ambil ukuran pada sumbu yang sedang aktif
            const size = (axis === 'x') ? currBlock.userData.width : currBlock.userData.depth;

            // JIKA MELESET TOTAL (Game Over)
            if (absDelta >= size) {
                gameOver();
                return;
            }

            // HITUNG UKURAN BARU & OVERHANG
            const remainingSize = size - absDelta;
            const overlapCenter = prevPos + delta / 2;

            // Update Metadata Ukuran
            let newWidth = currBlock.userData.width;
            let newDepth = currBlock.userData.depth;
            let overhangWidth = 0;
            let overhangDepth = 0;
            let overhangX = currBlock.position.x;
            let overhangZ = currBlock.position.z;

            // Modifikasi geometri berdasarkan sumbu
            if (axis === 'x') {
                newWidth = remainingSize;
                overhangWidth = absDelta;
                overhangDepth = newDepth;
                
                // Set posisi baru blok utama (tengah overlap)
                currBlock.position.x = overlapCenter;
                
                // Tentukan posisi overhang
                if (delta > 0) {
                    overhangX = currBlock.position.x + (newWidth / 2) + (overhangWidth / 2);
                } else {
                    overhangX = currBlock.position.x - (newWidth / 2) - (overhangWidth / 2);
                }
            } else { // axis === 'z'
                newDepth = remainingSize;
                overhangDepth = absDelta;
                overhangWidth = newWidth;

                currBlock.position.z = overlapCenter;

                if (delta > 0) {
                    overhangZ = currBlock.position.z + (newDepth / 2) + (overhangDepth / 2);
                } else {
                    overhangZ = currBlock.position.z - (newDepth / 2) - (overhangDepth / 2);
                }
            }

            // 1. UPDATE BLOK SAAT INI (Resize)
            // Three.js tidak bisa resize geometry dengan mudah, lebih baik buat baru dan hapus lama
            scene.remove(currBlock);
            const correctedBlock = createBlock(
                currBlock.position.x, 
                currBlock.position.y, 
                currBlock.position.z, 
                newWidth, 
                newDepth, 
                stack.length // index untuk warna
            );
            stack.push(correctedBlock);

            // 2. BUAT PUING JATUH (Overhang)
            const fallingPart = createOverhang(
                overhangX, 
                currBlock.position.y, 
                overhangZ, 
                overhangWidth, 
                overhangDepth, 
                correctedBlock.material.color
            );
            
            // Tambahkan fisika sederhana ke overhang
            overhangs.push({
                mesh: fallingPart,
                vy: 0, // velocity y
                rx: Math.random() * 0.1, // rotasi random
                rz: Math.random() * 0.1
            });

            // 3. UPDATE SCORE
            score++;
            scoreEl.innerText = score;

            // 4. LANJUT KE BLOK BERIKUTNYA
            spawnNextBlock();
        }

        function gameOver() {
            gameActive = false;
            
            // Efek jatuh blok terakhir
            if(currentBlock) {
                overhangs.push({
                    mesh: currentBlock,
                    vy: 0,
                    rx: Math.random() * 0.05,
                    rz: Math.random() * 0.05
                });
                // Hapus referensi currentBlock agar tidak dirender di loop
                currentBlock = null; 
            }

            // Update High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('stackHighScore', highScore);
                highScoreEl.innerText = `High Score: ${highScore}`;
            }
            
            finalScoreEl.innerText = score;
            gameOverScreen.classList.add('active');
        }

        // --- ANIMASI LOOP (RENDER) ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Gerakkan Blok Aktif (Bolak-balik)
            if (gameActive && currentBlock) {
                const speed = currentBlock.userData.startSpeed;
                const limit = 4; // Batas gerak sebelum balik arah

                currentBlock.position[axis] += speed * direction;

                // Cek batas untuk membalik arah
                if (currentBlock.position[axis] > limit) {
                    direction = -1;
                } else if (currentBlock.position[axis] < -limit) {
                    direction = 1;
                }
            }

            // 2. Animasi Kamera (Lerp agar halus)
            // Kamera naik mengikuti tinggi stack
            const targetY = stack.length * CONFIG.boxHeight + CONFIG.cameraOffset;
            camera.position.y += (targetY - camera.position.y) * 0.1;
            camera.lookAt(0, (stack.length - 3) * CONFIG.boxHeight, 0); // Selalu fokus sedikit di bawah puncak

            // 3. Fisika Puing Jatuh
            for (let i = overhangs.length - 1; i >= 0; i--) {
                const obj = overhangs[i];
                
                obj.vy -= 0.02; // Gravitasi
                obj.mesh.position.y += obj.vy;
                
                // Rotasi saat jatuh agar terlihat dramatis
                obj.mesh.rotation.x += obj.rx;
                obj.mesh.rotation.z += obj.rz;

                // Hapus jika sudah jauh di bawah (Optimasi Memori)
                if (obj.mesh.position.y < -20) {
                    scene.remove(obj.mesh);
                    obj.mesh.geometry.dispose();
                    obj.mesh.material.dispose();
                    overhangs.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Resize Window
        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Mulai Inisialisasi
        init();

    </script>
</body>
</html>
