<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Stack Tower</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation; /* Mencegah zoom pada double tap */
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #score-container {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none; /* Klik tembus ke canvas */
            color: white;
            z-index: 10;
        }

        #score {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            z-index: 20;
            transition: opacity 0.3s;
        }

        .menu-box {
            background: white;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 80%;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 2rem;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            outline: none;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background: #fa5252;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Wadah Skor -->
    <div id="score-container">
        <div id="score">0</div>
    </div>

    <!-- UI Start / Game Over -->
    <div id="ui-layer">
        <div class="menu-box" id="start-screen">
            <h1>3D Stack</h1>
            <p>Tap atau Spasi untuk menumpuk blok</p>
            <button id="start-btn">Mulai Main</button>
        </div>
        <div class="menu-box hidden" id="game-over-screen">
            <h1>Game Over</h1>
            <p>Skor Akhir: <span id="final-score">0</span></p>
            <button id="restart-btn">Coba Lagi</button>
        </div>
    </div>

    <!-- Canvas Game -->
    <div id="game-container"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /**
         * 3D STACK GAME
         * Menggunakan Three.js
         */

        // --- Variabel Global & Konfigurasi ---
        let scene, camera, renderer;
        let ambientLight, dirLight;
        
        // State Game
        let stack = [];     // Menyimpan blok yang sudah tertumpuk
        let overhangs = []; // Menyimpan potongan yang jatuh (debris)
        let gameEnded = false;
        let score = 0;
        let hueValue = 0;   // Untuk warna pelangi

        // Konstanta Blok
        const BOX_HEIGHT = 1;
        const ORIGINAL_BOX_SIZE = 3;
        let currentSize = { width: ORIGINAL_BOX_SIZE, depth: ORIGINAL_BOX_SIZE };
        
        // Variabel Gerakan
        let speed = 0.15;
        let axis = 'x'; // 'x' atau 'z'
        let direction = 1; // 1 atau -1
        
        // Referensi UI
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const uiLayer = document.getElementById('ui-layer');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // --- Inisialisasi ---
        function init() {
            // 1. Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd0e7f9); // Langit biru muda
            scene.fog = new THREE.Fog(0xd0e7f9, 10, 25);  // Kabut agar transisi horizon halus

            // 2. Setup Kamera (Orthographic agar perspektif isometrik rapi)
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            
            // Posisi isometrik klasik
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 0, 0);

            // 3. Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimasi performa HP
            renderer.shadowMap.enabled = true; // Aktifkan bayangan
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // 4. Pencahayaan
            // Cahaya ambient (dasar)
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Cahaya Matahari (Directional)
            dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // 5. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // Input: Klik mouse dan Sentuh layar
            document.addEventListener('pointerdown', handleInput);
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') handleInput(e);
            });

            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);

            // Loop render awal (kosong)
            renderer.render(scene, camera);
        }

        // --- Logika Gameplay ---

        function startGame() {
            // Reset Variable
            stack.forEach(obj => scene.remove(obj));
            overhangs.forEach(obj => scene.remove(obj));
            
            stack = [];
            overhangs = [];
            score = 0;
            gameEnded = false;
            hueValue = 0;
            currentSize = { width: ORIGINAL_BOX_SIZE, depth: ORIGINAL_BOX_SIZE };
            axis = 'x';
            direction = 1;
            speed = 0.15;

            scoreEl.innerText = score;
            
            // Reset Kamera
            camera.position.set(20, 20, 20);
            camera.lookAt(0, 0, 0);

            // Sembunyikan UI
            uiLayer.style.opacity = '0';
            setTimeout(() => {
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                uiLayer.style.display = 'none'; // Benar-benar hilangkan agar bisa klik canvas
            }, 300);

            // Tambahkan Base (Lantai Awal)
            addLayer(0, 0, ORIGINAL_BOX_SIZE, ORIGINAL_BOX_SIZE, false); // false = tidak bergerak
            
            // Tambahkan Layer Pertama yang bergerak
            addLayer(-10, 0, ORIGINAL_BOX_SIZE, ORIGINAL_BOX_SIZE, true); // mulai dari posisi jauh

            // Mulai Loop Animasi
            if (!renderer.info.autoClear) animate(); // Cek sederhana agar tidak double loop
            else animate();
        }

        function addLayer(x, z, width, depth, moving = true) {
            const y = stack.length * BOX_HEIGHT; // Posisi Y berdasarkan tumpukan
            
            // Buat Mesh
            const layer = createBlock(x, y, z, width, depth, hueValue);
            layer.direction = axis; // Simpan axis gerakan saat ini (x atau z)
            
            scene.add(layer);
            stack.push(layer);

            if (moving) {
                // Set posisi awal untuk animasi bolak-balik
                // Kita set posisi agak jauh agar terlihat masuk layar
                if (axis === 'x') {
                    layer.position.x = -10;
                } else {
                    layer.position.z = -10;
                }
            } else {
                // Base block (tidak bergerak)
                hueValue += 5; 
            }
        }

        /**
         * Fungsi membuat Mesh Blok Visual
         * Di sini tempat integrasi GLTFLoader jika ingin model kustom
         */
        function createBlock(x, y, z, width, depth, hue) {
            // Warna pelangi halus
            const color = new THREE.Color(`hsl(${hue}, 80%, 60%)`);
            
            // --- [GLTFLoader Integration Note] ---
            // Jika ingin menggunakan model 3D:
            // 1. Load model di `init()` dan simpan di variabel global.
            // 2. Di sini, clone model tersebut: `let mesh = model.clone();`
            // 3. Scale mesh agar sesuai dengan `width` dan `depth`:
            //    mesh.scale.set(width / originalModelSize, BOX_HEIGHT, depth / originalModelSize);
            // 4. Set material color jika perlu.
            // -------------------------------------

            // Menggunakan Three.js Geometry standar
            const geometry = new THREE.BoxGeometry(width, BOX_HEIGHT, depth);
            const material = new THREE.MeshLambertMaterial({ color: color });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Simpan properti dimensi untuk logika pemotongan
            mesh.userData = { width, depth };

            return mesh;
        }

        function handleInput(event) {
            // Jangan proses jika klik pada UI menu atau game sudah selesai
            if (gameEnded) return;
            if (event.type === 'pointerdown' && event.target.tagName === 'BUTTON') return;
            // Cegah klik tembus saat UI masih fade-out
            if (uiLayer.style.opacity !== '0' && uiLayer.style.display !== 'none') return;

            const topLayer = stack[stack.length - 1];
            const prevLayer = stack[stack.length - 2];

            // Jika ini blok pertama (di atas base), jalankan logika
            if (stack.length >= 2) {
                const moveDelta = time * speed; // Kecepatan saat ini
                
                // Hitung posisi relatif dan overlap
                // Logika inti pemotongan
                splitBlock(topLayer, prevLayer);
            }
        }

        function splitBlock(topLayer, prevLayer) {
            const direction = topLayer.direction; // 'x' atau 'z'
            
            // Hitung selisih posisi
            const delta = topLayer.position[direction] - prevLayer.position[direction];
            const overhangSize = Math.abs(delta);
            
            // Dimensi yang relevan (width untuk X, depth untuk Z)
            const size = direction === 'x' ? topLayer.userData.width : topLayer.userData.depth;
            
            const overlap = size - overhangSize;

            if (overlap > 0) {
                // --- BERHASIL (Masih ada sisa blok) ---
                
                // Potong Ukuran
                cutBox(topLayer, overlap, delta, direction);
                
                // Update Skor
                score++;
                scoreEl.innerText = score;
                hueValue += 5; // Geser warna

                // Tambah kecepatan sedikit (makin tinggi makin cepat)
                if(score % 5 === 0) speed += 0.01;

                // Ganti Axis gerakan untuk blok berikutnya
                axis = axis === 'x' ? 'z' : 'x';

                // Hitung dimensi blok baru
                const nextX = direction === 'x' ? topLayer.position.x : topLayer.position.x;
                const nextZ = direction === 'z' ? topLayer.position.z : topLayer.position.z;
                
                // Current Size global diperbarui di fungsi cutBox
                
                // Spawn blok baru di atasnya
                addLayer(nextX, nextZ, currentSize.width, currentSize.depth);

            } else {
                // --- GAGAL (Meleset total) ---
                endGame();
            }
        }

        function cutBox(topLayer, overlap, delta, axisType) {
            const currentW = topLayer.userData.width;
            const currentD = topLayer.userData.depth;

            // Update metadata ukuran global
            if (axisType === 'x') {
                currentSize.width = overlap;
                // Posisi baru blok yang tersisa (di tengah area overlap)
                topLayer.scale.x = overlap / currentW;
                topLayer.position.x -= delta / 2;
                topLayer.userData.width = overlap;

                // Buat Potongan Jatuh (Debris)
                const overhangShift = (overlap / 2 + (currentW - overlap) / 2) * Math.sign(delta);
                const overhangX = topLayer.position.x + overhangShift;
                const overhangW = currentW - overlap;
                addOverhang(overhangX, topLayer.position.y, topLayer.position.z, overhangW, currentD, 'x');

            } else { // axisType === 'z'
                currentSize.depth = overlap;
                // Posisi baru
                topLayer.scale.z = overlap / currentD;
                topLayer.position.z -= delta / 2;
                topLayer.userData.depth = overlap;

                // Buat Potongan Jatuh
                const overhangShift = (overlap / 2 + (currentD - overlap) / 2) * Math.sign(delta);
                const overhangZ = topLayer.position.z + overhangShift;
                const overhangD = currentD - overlap;
                addOverhang(topLayer.position.x, topLayer.position.y, overhangZ, currentW, overhangD, 'z');
            }
            
            // Visual: Update Texture/Geometry sejati (opsional, tapi scaling sudah cukup visual)
            // ThreeJS scaling tidak mengubah geometri bounding box asli, tapi visualnya benar.
        }

        function addOverhang(x, y, z, width, depth, axisType) {
            const color = stack[stack.length-1].material.color;
            const material = new THREE.MeshLambertMaterial({ color: color });
            const geometry = new THREE.BoxGeometry(width, BOX_HEIGHT, depth);
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Data fisika sederhana untuk animasi jatuh
            mesh.userData = {
                velocity: { y: 0, rx: Math.random() * 0.2 - 0.1, rz: Math.random() * 0.2 - 0.1 },
                active: true
            };

            overhangs.push(mesh);
            scene.add(mesh);
        }

        function endGame() {
            gameEnded = true;
            finalScoreEl.innerText = score;
            
            // Tampilkan Menu Game Over
            uiLayer.style.display = 'flex';
            uiLayer.style.opacity = '1';
            startScreen.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');

            // Efek jatuh blok terakhir
            const topLayer = stack.pop();
            if(topLayer) {
                scene.remove(topLayer);
                addOverhang(topLayer.position.x, topLayer.position.y, topLayer.position.z, topLayer.userData.width, topLayer.userData.depth, axis);
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            
            // Update parameter kamera orthographic
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Loop Animasi ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);

            // 1. Gerakkan blok aktif (paling atas)
            if (!gameEnded && stack.length > 1) {
                const topLayer = stack[stack.length - 1];
                time += speed; // Time increment
                
                // Gunakan Math.sin/cos untuk gerakan bolak-balik yang smooth
                // Jarak 10 unit bolak balik
                const limit = 10; 
                // Kita gunakan linear movement ping-pong manual agar kecepatan konstan (lebih adil)
                // Tapi Math.sin lebih mudah dikoding. Untuk game stack presisi, linear lebih baik.
                // Mari gunakan Linear PingPong logic sederhana:
                
                const frameSpeed = 0.15 + (score * 0.005); // Kecepatan per frame
                
                if (topLayer.direction === 'x') {
                    topLayer.position.x += frameSpeed * direction;
                    if (topLayer.position.x > limit || topLayer.position.x < -limit) {
                        direction *= -1; // Balik arah
                    }
                } else {
                    topLayer.position.z += frameSpeed * direction;
                    if (topLayer.position.z > limit || topLayer.position.z < -limit) {
                        direction *= -1;
                    }
                }
            }

            // 2. Naikkan Kamera dengan mulus (Lerp)
            if (stack.length > 0) {
                const targetY = stack.length * BOX_HEIGHT + 15; // Jaga jarak Y
                camera.position.y += (targetY - camera.position.y) * 0.05; // Smoothing factor
            }

            // 3. Animasikan Debris (Potongan Jatuh)
            overhangs.forEach((obj, index) => {
                if (!obj.userData.active) return;

                // Gravitasi
                obj.position.y -= 0.5;
                // Rotasi saat jatuh
                obj.rotation.x += obj.userData.velocity.rx;
                obj.rotation.z += obj.userData.velocity.rz;

                // Hapus jika sudah jauh di bawah
                if (obj.position.y < -20) {
                    scene.remove(obj);
                    obj.userData.active = false;
                    // Hapus dari array (opsional, untuk performa jangka panjang)
                    overhangs.splice(index, 1);
                }
            });

            renderer.render(scene, camera);
        }

        // Jalankan Inisialisasi
        init();

    </script>
</body>
</html>
